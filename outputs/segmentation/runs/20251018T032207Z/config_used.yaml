data:
  dataset_name: saberzl/SID_Set
  image_size: 224
  train_samples: 100000
  val_samples: 5000
  test_samples: 5000
  use_streaming: false
  use_disk_cache: true
  augment:
    enable: true
    random_resized_crop: true
    scale_min: 0.8
    scale_max: 1.2
    horizontal_flip_prob: 0.5
    color_jitter_brightness: 0.1
    color_jitter_contrast: 0.1
    color_jitter_saturation: 0.1
    color_jitter_hue: 0.02
    gaussian_blur_prob: 0.1
    gaussian_blur_sigma_min: 0.1
    gaussian_blur_sigma_max: 1.5
    random_erasing_prob: 0.0
    random_erasing_scale_min: 0.02
    random_erasing_scale_max: 0.2
    random_erasing_ratio_min: 0.3
    random_erasing_ratio_max: 3.3
    preview_samples: 32
    preview_seed: 1234
loader:
  batch_size: 128
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
model:
  class_names:
  - Real
  - Synthetic
  - Tampered
  num_classes: 3
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
  tampered_label: 2
training:
  epochs: 100
  learning_rate: 0.001
  seed: 42
  device: cuda
  checkpoint_frequency: 5
  keep_checkpoints: 3
  label_smoothing: 0.0
  grad_clip_norm: 1.0
  ema_decay: 0.0
  optimizer:
    name: adamw
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.95
    momentum: 0.9
    nesterov: false
  scheduler:
    name: onecycle
    t_max: 0
    max_lr: 0.003
    pct_start: 0.15
    div_factor: 25.0
    final_div_factor: 10000.0
paths:
  base: outputs
  run_id: 20251018T032207Z
  task: segmentation
  model_filename: best_model.pth
  history_filename: history.json
  metrics_filename: evaluation_metrics.json
  log_filename: logs
  args_filename: args.json
  checkpoints: checkpoints
Task:
  CLASSIFICATION: classification
  SEGMENTATION: segmentation
  PLOT: plot
