data:
  dataset_name: saberzl/SID_Set
  image_size: 224
  train_samples: 10000
  val_samples: 1000
  test_samples: 1000
  use_streaming: false
  use_disk_cache: true

loader:
  batch_size: 24
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 4

model:
  tampered_label: 2
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 5
  learning_rate: 0.0003
  seed: 42

paths:
  model_path: models/segmentation/segmentation_best_model.pth
  results_dir: results/segmentation
  history_file: segmentation_history.json
  logging_dir: logs/segmentation
