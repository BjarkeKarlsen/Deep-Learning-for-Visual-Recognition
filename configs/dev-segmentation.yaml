data:
  dataset_name: saberzl/SID_Set
  image_size: 128
  train_samples: 2
  val_samples: 1
  test_samples: 1
  use_streaming: true
  use_disk_cache: false

loader:
  batch_size: 2
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 0

model:
  tampered_label: 2
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 1
  learning_rate: 0.0005
  seed: 42
  optimizer:
    name: adam
    params: {}

paths:
  model_path: outputs/models/dev/segmentation_best_model.pth
  results_dir: outputs/results/dev/segmentation
  history_file: segmentation_history.json
  logging_dir: outputs/logs/dev/segmentation
