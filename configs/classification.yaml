data:
  dataset_name: saberzl/SID_Set
  image_size: 224
  train_samples: 100000
  val_samples: 20000
  test_samples: 8000
  use_streaming: false
  use_disk_cache: true

loader:
  batch_size: 32
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 8

model:
  class_names:
    - Real
    - Synthetic
    - Tampered
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 50
  learning_rate: 0.0005
  seed: 42
  device: cuda
  save_interval: 5
  optimizer:
    name: adamw
    weight_decay: 0.01
    betas:
      - 0.9
      - 0.95

paths:
  base: outputs
  task: classification
  model_filename: best_model.pth
  history_filename: history.json
  metrics_filename: evaluation_metrics.json
  log_filename: logs
