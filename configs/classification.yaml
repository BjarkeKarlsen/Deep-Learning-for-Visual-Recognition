data:
  dataset_name: saberzl/SID_Set
  image_size: 224
  train_samples: 2000
  val_samples: 300
  test_samples: 50
  use_streaming: true
  use_disk_cache: false

loader:
  batch_size: 32
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 4

model:
  class_names:
    - Real
    - Synthetic
    - Tampered
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 5
  learning_rate: 0.0005
  seed: 42
  device: cuda

paths:
  base: outputs
  env: test
  model_filename: best_model.pth
  history_filename: history.json
  eval_metrics_filename: evaluation_metrics.json
  log_subdir: logs
