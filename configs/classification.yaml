data:
  dataset_name: saberzl/SID_Set
  image_size: 224
  train_samples: 100
  val_samples: 10
  test_samples: 10
  use_streaming: false
  use_disk_cache: true

loader:
  batch_size: 32
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 4

model:
  class_names:
    - Real
    - Synthetic
    - Tampered
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 5
  learning_rate: 0.0005
  seed: 42

paths:
  model_path: outputs/models/classification/best_model.pth
  results_dir: outputs/results/classification
  history_file: training_history.json
  logging_dir: outputs/logs/classification
