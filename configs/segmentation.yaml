data:
  dataset_name: saberzl/SID_Set
  image_size: 512
  train_samples: 1000
  val_samples: 1000
  test_samples: 100
  use_streaming: true
  use_disk_cache: true

loader:
  batch_size: 32
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 4

model:
  tampered_label: 2
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 30
  learning_rate: 0.0003
  seed: 42

paths:
  base: outputs
  env: test
  model_filename: best_model.pth
  history_filename: history.json
  eval_metrics_filename: evaluation_metrics.json
  log_subdir: logs