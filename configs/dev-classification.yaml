data:
  dataset_name: saberzl/SID_Set
  image_size: 128
  train_samples: 4
  val_samples: 2
  test_samples: 2
  use_streaming: true
  use_disk_cache: false

loader:
  batch_size: 2
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 0

model:
  class_names:
    - Real
    - Synthetic
    - Tampered
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 1
  learning_rate: 0.001
  seed: 42

paths:
  model_path: outputs/models/dev/classification_best_model.pth
  results_dir: outputs/results/dev/classification
  history_file: training_history.json
  logging_dir: outputs/logs/dev/classification
