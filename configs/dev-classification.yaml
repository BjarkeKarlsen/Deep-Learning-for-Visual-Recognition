data:
  dataset_name: saberzl/SID_Set
  image_size: 128
  train_samples: 12
  val_samples: 4
  test_samples: 4
  use_streaming: true
  use_disk_cache: true

loader:
  batch_size: 4
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false
  num_workers: 0

model:
  class_names:
    - Real
    - Synthetic
    - Tampered
  normalize_mean:
    - 0.485
    - 0.456
    - 0.406
  normalize_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 12
  learning_rate: 0.001
  seed: 42
  checkpoint_frequency: 5
  keep_checkpoints: 3
  optimizer:
    name: adamw
    weight_decay: 0.01
    betas:
      - 0.9
      - 0.95

paths:
  base: outputs
  task: classification
  model_filename: best_model.pth
  history_filename: history.json
  metrics_filename: evaluation_metrics.json
  log_filename: logs
  checkpoints: checkpoints
